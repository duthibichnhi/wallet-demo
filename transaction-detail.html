<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffedd5">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Chi tiết giao dịch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overscroll-behavior: none; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(to bottom, #ffedd5 0%, #f87171 100%);
      margin: 0; padding: 0;
      min-height: 100dvh;
      overscroll-behavior: none;
    }
    .screen {
      width: 100%;
      height: 100dvh;
      background: linear-gradient(to bottom, #ffedd5 0%, #f87171 100%);
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      overflow: hidden;
    }

    /* ── Nav bar ── */
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      padding-top: calc(env(safe-area-inset-top) + 12px);
      height: calc(env(safe-area-inset-top) + 56px);
      flex-shrink: 0;
    }
    .nav-back {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; background: none; border: none; padding: 0;
    }
    .nav-title {
      font-size: 18px; font-weight: 600; color: #0a0a0a;
      line-height: 28px; flex: 1;
    }

    /* ── Main container ── */
    .main-container {
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      overflow-y: auto; overflow-x: hidden;
      overscroll-behavior-y: none;
      scrollbar-width: none;
    }
    .main-container::-webkit-scrollbar { display: none; }

    .content {
      padding: 16px;
      flex: 1;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* ── Card (shared) ── */
    .card {
      background: #fafafa;
      border-radius: 16px;
      padding: 8px 16px;
      width: 100%;
    }

    /* ── Hero card ── */
    .hero {
      display: flex; align-items: center; gap: 16px;
      padding: 16px;
    }
    .hero-icon {
      width: 48px; height: 48px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #ffffff;
      border-radius: 9999px;
    }
    .hero-icon svg { width: 28px; height: 28px; }
    .hero-info {
      display: flex; flex-direction: column; gap: 0;
      flex: 1; min-width: 0;
    }
    .hero-label {
      font-size: 16px; font-weight: 400; color: #0a0a0a;
      line-height: 24px;
    }
    .hero-amount { display: flex; align-items: baseline; gap: 2px; }
    .hero-amount-value {
      font-size: 18px; font-weight: 600; color: #0a0a0a; line-height: 28px;
    }
    .hero-amount-unit {
      font-size: 10.32px; font-weight: 500; color: #0a0a0a;
      line-height: 24px;
    }
    .hero-amount.positive .hero-amount-value,
    .hero-amount.positive .hero-amount-unit { color: #16a34a; }
    .hero-amount.processing .hero-amount-value,
    .hero-amount.processing .hero-amount-unit { color: rgba(10,10,10,0.25); }
    .hero-amount.failed .hero-amount-value,
    .hero-amount.failed .hero-amount-unit { color: rgba(10,10,10,0.25); }

    /* ── Section rows ── */
    .section-row {
      display: flex; justify-content: space-between; align-items: center;
      min-height: 40px; gap: 8px;
      padding: 8px 0;
    }
    .row-label {
      font-size: 16px; font-weight: 400; color: #0a0a0a;
      line-height: 24px; flex-shrink: 0;
    }
    .row-value {
      font-size: 16px; font-weight: 500; color: #0a0a0a;
      line-height: 24px; text-align: right;
      flex: 1; min-width: 0;
      word-break: break-all;
    }
    .row-value-with-copy {
      display: flex; align-items: center; gap: 8px;
      justify-content: flex-end;
      flex: 1; min-width: 0;
    }
    .copy-btn {
      width: 24px; height: 24px; flex-shrink: 0;
      background: none; border: none; padding: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .copy-btn:active { opacity: 0.6; }
    .copy-btn svg { width: 20px; height: 20px; }

    /* Status */
    .status-value { font-size: 16px; font-weight: 600; line-height: 24px; }
    .status-success { color: #16a34a; }
    .status-processing { color: #0a0a0a; }
    .status-failed { color: #ef4444; }

    /* ── Bottom CTA ── */
    .bottom-cta {
      padding: 16px;
      padding-bottom: calc(env(safe-area-inset-bottom, 8px) + 8px);
      flex-shrink: 0;
      background: #ffffff;
    }
    .cta-btn {
      width: 100%; height: 48px;
      border-radius: 9999px;
      border: 1px solid #737373;
      background: #ffffff;
      font-family: inherit;
      font-size: 16px; font-weight: 500; color: #0a0a0a;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .cta-btn:active { background: #f5f5f5; }

    /* Toast */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: #0a0a0a; color: #fff;
      font-size: 14px; font-weight: 500;
      padding: 8px 16px; border-radius: 8px;
      opacity: 0; transition: opacity 0.3s;
      z-index: 50; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="screen">

    <!-- Nav -->
    <div class="nav-bar">
      <button class="nav-back" onclick="goBack()">
        <svg width="9.3" height="16" viewBox="0 0 9.33333 16" fill="none">
          <path d="M8.66667 1.33337L1.66667 8.00004L8.66667 14.6667" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="nav-title">Chi tiết giao dịch</div>
    </div>

    <!-- Main -->
    <div class="main-container">
      <div class="content">

        <!-- Hero -->
        <div class="card hero">
          <div class="hero-icon" id="hero-icon"></div>
          <div class="hero-info">
            <div class="hero-label" id="hero-label"></div>
            <div class="hero-amount" id="hero-amount">
              <span class="hero-amount-value" id="hero-amount-value"></span>
              <span class="hero-amount-unit">₫</span>
            </div>
          </div>
        </div>

        <!-- Status -->
        <div class="card">
          <div class="section-row">
            <span class="row-label">Trạng thái</span>
            <span class="status-value" id="status-value"></span>
          </div>
        </div>

        <!-- Info section -->
        <div class="card" id="info-section"></div>

        <!-- Extra section (type-specific) -->
        <div class="card" id="extra-section" style="display:none"></div>

      </div>

      <!-- CTA -->
      <div class="bottom-cta" id="bottom-cta" style="display:none">
        <button class="cta-btn" id="cta-btn"></button>
      </div>
    </div>

  </div>

  <div class="toast" id="toast">Đã sao chép</div>

  <script>
    function goBack() {
      if (document.referrer && document.referrer.includes('transaction-history') || document.referrer.includes('index.html') || document.referrer.endsWith('/')) {
        history.back();
      } else {
        location.href = 'index.html';
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).catch(() => {});
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function generateTxCode() {
      const chars = '0123456789ABCDEF';
      let code = '';
      for (let i = 0; i < 20; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function makeRow(label, value, copyable) {
      const row = document.createElement('div');
      row.className = 'section-row';
      if (copyable) {
        row.innerHTML = `<span class="row-label">${label}</span>
          <div class="row-value row-value-with-copy">
            <span>...${value.slice(-10)}</span>
            <button class="copy-btn" onclick="copyText('${value}')">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="1.5" stroke="#0a0a0a" stroke-width="1.3"/><path d="M11 3H3.5C3.22 3 3 3.22 3 3.5V11" stroke="#0a0a0a" stroke-width="1.3" stroke-linecap="round"/></svg>
            </button>
          </div>`;
      } else {
        row.innerHTML = `<span class="row-label">${label}</span><span class="row-value">${value}</span>`;
      }
      return row;
    }

    const TYPE_CONFIG = {
      deposit: {
        label: 'Nạp tiền',
        cta: 'Nạp thêm',
        infoFields: (tx) => [
          { label: 'Nguồn tiền', value: tx.source || 'Techcombank' },
          { label: 'Phí dịch vụ', value: 'Miễn phí' },
        ],
      },
      withdraw: {
        label: 'Rút tiền',
        cta: null,
        infoFields: (tx) => [
          { label: 'Tài khoản nhận tiền', value: tx.dest || extractBank(tx.name) },
          { label: 'Phí dịch vụ', value: 'Miễn phí' },
        ],
      },
      transfer: {
        label: 'Chuyển tiền',
        cta: 'Chuyển thêm',
        infoFields: (tx) => [
          { label: 'Nguồn tiền', value: 'Ví Win Money' },
          { label: 'Phí dịch vụ', value: 'Miễn phí' },
        ],
        extraFields: (tx) => {
          const recipient = extractRecipient(tx.name);
          return [
            { label: 'Người nhận', value: recipient },
            { label: 'Số điện thoại', value: '***9065' },
            { label: 'Nội dung', value: recipient + ' chuyển tiền' },
          ];
        },
      },
      receive: {
        label: 'Nhận tiền',
        cta: 'Chuyển lại',
        infoFields: (tx) => [
          { label: 'Tài khoản nhận tiền', value: 'Ví Win Money' },
        ],
        extraFields: (tx) => {
          const sender = extractRecipient(tx.name);
          return [
            { label: 'Người chuyển', value: sender },
            { label: 'Số điện thoại', value: '***9065' },
            { label: 'Nội dung', value: sender + ' chuyển tiền' },
          ];
        },
      },
      payment: {
        label: 'Thanh toán dịch vụ',
        cta: null,
        infoFields: (tx) => [
          { label: 'Nguồn tiền', value: 'Ví Win Money' },
          { label: 'Phí dịch vụ', value: 'Miễn phí' },
        ],
        extraFields: (tx) => [
          { label: 'Dịch vụ', value: 'Winmart' },
          { label: 'Cửa hàng', value: 'Siêu thị Winmart Đồng Khởi' },
          { label: 'Mô tả', value: 'Thanh toán đơn hàng' },
        ],
      },
    };

    function extractRecipient(name) {
      const m = name.match(/(?:đến|từ)\s+(.+)/i);
      return m ? toTitleCase(m[1]) : 'Dư Thị Bích Nhi';
    }

    function extractBank(name) {
      const m = name.match(/về\s+(.+)/i);
      return m ? m[1] : 'Techcombank';
    }

    function toTitleCase(str) {
      return str.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
    }

    const STATUS_MAP = {
      success: { text: 'Thành công', cls: 'status-success' },
      processing: { text: 'Đang xử lý', cls: 'status-processing' },
      failed: { text: 'Thất bại', cls: 'status-failed' },
    };

    function render() {
      const raw = sessionStorage.getItem('txDetail');
      if (!raw) { location.href = 'index.html'; return; }
      const tx = JSON.parse(raw);

      const config = TYPE_CONFIG[tx.type] || TYPE_CONFIG.deposit;

      // Hero icon
      document.getElementById('hero-icon').innerHTML = tx.iconSvg || '';

      // Hero label
      document.getElementById('hero-label').textContent = config.label;

      // Hero amount
      const amountEl = document.getElementById('hero-amount');
      const sign = tx.sign === '+' ? '+ ' : '- ';
      document.getElementById('hero-amount-value').textContent = sign + tx.amount;
      if (tx.sign === '+') amountEl.classList.add('positive');
      if (tx.status === 'processing') amountEl.classList.add('processing');
      if (tx.status === 'failed') amountEl.classList.add('failed');

      // Status
      const st = STATUS_MAP[tx.status] || STATUS_MAP.success;
      const statusEl = document.getElementById('status-value');
      statusEl.textContent = st.text;
      statusEl.className = 'status-value ' + st.cls;

      // Info section
      const infoSection = document.getElementById('info-section');
      const txCode = generateTxCode();
      infoSection.appendChild(makeRow('Thời gian', tx.date));
      infoSection.appendChild(makeRow('Mã giao dịch', txCode, true));
      config.infoFields(tx).forEach(f => {
        infoSection.appendChild(makeRow(f.label, f.value));
      });

      // Extra section
      if (config.extraFields) {
        const extraSection = document.getElementById('extra-section');
        extraSection.style.display = '';
        config.extraFields(tx).forEach(f => {
          extraSection.appendChild(makeRow(f.label, f.value));
        });
      }

      // CTA
      if (config.cta) {
        const ctaWrap = document.getElementById('bottom-cta');
        ctaWrap.style.display = '';
        document.getElementById('cta-btn').textContent = config.cta;
      }
    }

    render();
  </script>
</body>
</html>
